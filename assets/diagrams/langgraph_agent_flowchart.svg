<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1200" height="950" fill="url(#canvasGrad)" />

  <!-- Header -->
  <text x="600" y="45" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="1">HIREFORGE — LANGGRAPH AGENT STATE MACHINE</text>
  <text x="600" y="72" text-anchor="middle" font-size="13" fill="#94a3b8">Cyclic State Transitions &#8226; Conditional Branching &#8226; Deterministic ATS Scorer &#8226; Post-PDF Verification</text>

  <!-- Side Panel: AgentState Schema -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="260" height="780" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="40" rx="14" fill="#1e293b" />
    <text x="130" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">AgentState (TypedDict)</text>

    <text x="18" y="70" font-size="11" font-family="monospace" fill="#93c5fd">job_id: str</text>
    <text x="18" y="92" font-size="11" font-family="monospace" fill="#93c5fd">resume_text: str</text>
    <text x="18" y="114" font-size="11" font-family="monospace" fill="#93c5fd">jd_text: str</text>
    <text x="18" y="136" font-size="11" font-family="monospace" fill="#93c5fd">template_kind: str</text>
    <text x="18" y="158" font-size="11" font-family="monospace" fill="#93c5fd">target_score: int</text>

    <line x1="18" y1="175" x2="242" y2="175" stroke="#1e293b" stroke-width="1.5" />

    <text x="18" y="200" font-size="11" font-family="monospace" fill="#a7f3d0">parsed_resume: dict</text>
    <text x="18" y="222" font-size="11" font-family="monospace" fill="#a7f3d0">parsed_jd: dict</text>
    <text x="18" y="244" font-size="11" font-family="monospace" fill="#fde047">ats_score: int</text>
    <text x="18" y="266" font-size="11" font-family="monospace" fill="#fde047">keyword_map: dict</text>
    <text x="18" y="288" font-size="11" font-family="monospace" fill="#fde047">gaps: list[str]</text>

    <line x1="18" y1="305" x2="242" y2="305" stroke="#1e293b" stroke-width="1.5" />

    <text x="18" y="330" font-size="11" font-family="monospace" fill="#f472b6">rewritten_resume: str</text>
    <text x="18" y="352" font-size="11" font-family="monospace" fill="#f472b6">iteration: int (max 3)</text>
    <text x="18" y="374" font-size="11" font-family="monospace" fill="#f472b6">suggestions: list</text>
    <text x="18" y="396" font-size="11" font-family="monospace" fill="#4ade80">final_score: int</text>
    <text x="18" y="418" font-size="11" font-family="monospace" fill="#94a3b8">progress: list[str]</text>

    <!-- State Explanation box -->
    <rect x="15" y="450" width="230" height="310" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="130" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#a5b4fc">State Principles</text>
    <text x="25" y="505" font-size="11" fill="#e0e7ff">&#8226; Immutability:</text>
    <text x="25" y="522" font-size="10" fill="#c7d2fe">Nodes return {**state, ...} updates</text>
    <text x="25" y="550" font-size="11" fill="#e0e7ff">&#8226; Zero Global State:</text>
    <text x="25" y="567" font-size="10" fill="#c7d2fe">Each job run is fully isolated</text>
    <text x="25" y="595" font-size="11" fill="#e0e7ff">&#8226; Telemetry State:</text>
    <text x="25" y="612" font-size="10" fill="#c7d2fe">progress[] accumulates logs</text>
    <text x="25" y="627" font-size="10" fill="#c7d2fe">pushed to WebSocket in real-time</text>
    <text x="25" y="655" font-size="11" fill="#e0e7ff">&#8226; Cycle Defense:</text>
    <text x="25" y="672" font-size="10" fill="#c7d2fe">iteration counter strictly caps</text>
    <text x="25" y="687" font-size="10" fill="#c7d2fe">rewrite passes to 3 iterations</text>
    <text x="25" y="715" font-size="11" fill="#e0e7ff">&#8226; Truthful Output:</text>
    <text x="25" y="732" font-size="10" fill="#c7d2fe">Gaps never fabricated</text>
  </g>

  <!-- ================= MAIN FLOW GRAPH ================= -->
  
  <!-- START -->
  <g transform="translate(620, 110)">
    <circle cx="60" cy="25" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">START</text>
  </g>

  <!-- Arrow Start -> Parse -->
  <path d="M 680, 160 L 680, 185" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Node 1: parse_documents -->
  <g transform="translate(460, 190)" filter="url(#cardShadow)">
    <rect width="440" height="85" rx="12" fill="url(#nodeBlue)" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="220" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">NODE: parse_documents</text>
    <text x="220" y="47" text-anchor="middle" font-size="11" fill="#e2e8f0">Groq LLM (LLaMA 3.3 70B Versatile)</text>
    <text x="220" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">Extracts clean JSON schemas: parsed_resume &amp; parsed_jd via _parse_json()</text>
  </g>

  <!-- Arrow Parse -> Score -->
  <path d="M 680, 275 L 680, 305" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Node 2: ats_score -->
  <g transform="translate(460, 310)" filter="url(#cardShadow)">
    <rect width="440" height="95" rx="12" fill="url(#nodeBlue)" stroke="#eab308" stroke-width="1.5" />
    <text x="220" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#facc15">NODE: ats_score (Deterministic Scorer)</text>
    <text x="220" y="47" text-anchor="middle" font-size="11" fill="#e2e8f0">Score = (Req% &#215; 60) + (Nice% &#215; 20) + (Format% &#215; 20)</text>
    <text x="220" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">&#8226; Alias dictionary expansion: 'k8s' &#8596; 'kubernetes', 'ts' &#8596; 'typescript'</text>
    <text x="220" y="82" text-anchor="middle" font-size="10" fill="#86efac">Zero LLM cost &#8226; 100% deterministic &#8226; Produces: ats_score, keyword_map, gaps</text>
  </g>

  <!-- Arrow Score -> Decision -->
  <path d="M 680, 405 L 680, 440" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Decision Diamond: route_after_score -->
  <g transform="translate(570, 440)">
    <polygon points="110,0 220,45 110,90 0,45" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <text x="110" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#e0e7ff">route_after_score()</text>
    <text x="110" y="58" text-anchor="middle" font-size="9" fill="#a5b4fc">Check ATS Score</text>
  </g>

  <!-- Branch 1: Score < 40 -> suggest_additions -->
  <path d="M 570, 485 L 440, 485 L 440, 545" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)" />
  <text x="495" y="475" text-anchor="middle" font-size="10" font-weight="700" fill="#fbbf24">Score &lt; 40 (Gap too big)</text>

  <!-- Branch 2: 40 <= Score < Target -> rewrite_resume -->
  <path d="M 790, 485 L 920, 485 L 920, 545" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="865" y="475" text-anchor="middle" font-size="10" font-weight="700" fill="#c084fc">40 &#8804; Score &lt; Target</text>

  <!-- Branch 3: Score >= Target (Direct Bypass to Verify) -->
  <path d="M 680, 530 L 680, 680" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowGreen)" />
  <text x="705" y="605" font-size="10" font-weight="700" fill="#34d399">Score &#8805; Target (Bypass)</text>

  <!-- Node 4: suggest_additions -->
  <g transform="translate(340, 550)" filter="url(#cardShadow)">
    <rect width="220" height="90" rx="10" fill="#2d1b10" stroke="#f59e0b" stroke-width="1.5" />
    <text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">suggest_additions</text>
    <text x="110" y="44" text-anchor="middle" font-size="10" fill="#fde68a">No fake skills generated</text>
    <text x="110" y="62" text-anchor="middle" font-size="9" fill="#fef3c7">Recommends 4-5 real-world</text>
    <text x="110" y="76" text-anchor="middle" font-size="9" fill="#fef3c7">projects, certifications &amp; courses</text>
  </g>

  <!-- Node 3: rewrite_resume -->
  <g transform="translate(800, 550)" filter="url(#cardShadow)">
    <rect width="250" height="90" rx="10" fill="#241436" stroke="#c084fc" stroke-width="1.5" />
    <text x="125" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#e879f9">rewrite_resume</text>
    <text x="125" y="44" text-anchor="middle" font-size="10" fill="#f5d0fe">LLM Rewrite with constraints</text>
    <text x="125" y="62" text-anchor="middle" font-size="9" fill="#fae8ff">&#8226; Injects missing keywords naturally</text>
    <text x="125" y="76" text-anchor="middle" font-size="9" fill="#fae8ff">&#8226; Strong action verbs (Led, Architected)</text>
  </g>

  <!-- Both converge into Node 5: verify_score -->
  <path d="M 450, 640 L 450, 715 L 530, 715" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)" />
  <path d="M 920, 640 L 920, 715 L 830, 715" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 5: verify_score -->
  <g transform="translate(540, 680)" filter="url(#cardShadow)">
    <rect width="280" height="85" rx="12" fill="url(#nodeBlue)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="140" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">NODE: verify_score</text>
    <text x="140" y="47" text-anchor="middle" font-size="10" fill="#e2e8f0">Re-extracts structured data from rewrite</text>
    <text x="140" y="65" text-anchor="middle" font-size="10" fill="#94a3b8">Re-runs compute_ats_score ➔ sets final_score</text>
  </g>

  <!-- Conditional Edge: route_after_verify -->
  <!-- Loop Back to rewrite_resume if score < target and iter < 3 -->
  <path d="M 820, 720 C 1090, 720, 1090, 595, 1050, 595" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <text x="1100" y="660" text-anchor="middle" font-size="10" font-weight="700" fill="#fb7185">Loop Back (iter &lt; 3)</text>
  <text x="1100" y="675" text-anchor="middle" font-size="9" fill="#fda4af">Score still &lt; Target</text>

  <!-- Complete Arrow -> Final PDF Phase -->
  <path d="M 680, 765 L 680, 810" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="760" y="792" font-size="10" font-weight="700" fill="#34d399">Target hit OR iter == 3</text>

  <!-- Post-Processing Box: LaTeX & Post-PDF Re-score -->
  <g transform="translate(420, 815)" filter="url(#cardShadow)">
    <rect width="520" height="90" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <text x="260" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">Post-Graph Stage: LaTeX Compilation &amp; "Score What You Ship"</text>
    <text x="20" y="48" font-size="10" fill="#ccfbf1">1. resume_renderer.build_resume_document ➔ Restructures into one-page LaTeX template schema</text>
    <text x="20" y="65" font-size="10" fill="#ccfbf1">2. pdflatex subprocess compile ➔ Generates official PDF &amp; uploads to Amazon S3</text>
    <text x="20" y="82" font-size="10" font-weight="700" fill="#facc15">3. Post-PDF Re-Score: Scores the REAL physical document, eliminating score discrepancy!</text>
  </g>
</svg>
