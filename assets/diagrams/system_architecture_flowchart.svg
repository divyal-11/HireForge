<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#131b2e" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a855f7" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1400" height="950" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1400" height="950" fill="url(#grid)" />
  </g>

  <!-- Title Header -->
  <text x="700" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="1">HIREFORGE — END-TO-END SYSTEM ARCHITECTURE</text>
  <text x="700" y="80" text-anchor="middle" font-size="14" fill="#94a3b8">Decoupled Asynchronous Microservices &bull; Event-Driven SQS &bull; Autonomous LangGraph Agent &bull; LaTeX PDF</text>

  <!-- ================= PHASE 1: CLIENT TIER ================= -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="250" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="42" rx="16" fill="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="42" cy="21" r="6" fill="#f59e0b" />
    <circle cx="60" cy="21" r="6" fill="#10b981" />
    <text x="140" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">1. Client / Frontend</text>

    <!-- Content -->
    <text x="20" y="70" font-size="13" font-weight="600" fill="#f1f5f9">React 18 + Vite SPA</text>
    <text x="20" y="92" font-size="12" fill="#94a3b8">&bull; UploadForm.jsx (PDF + JD)</text>
    <text x="20" y="112" font-size="12" fill="#94a3b8">&bull; ResultsPanel.jsx (Visualizer)</text>
    <text x="20" y="132" font-size="12" fill="#94a3b8">&bull; ScoreRing &amp; Heatmap</text>

    <line x1="20" y1="150" x2="230" y2="150" stroke="#334155" stroke-dasharray="4" />

    <text x="20" y="175" font-size="13" font-weight="600" fill="#38bdf8">Realtime Listener</text>
    <text x="20" y="195" font-size="12" fill="#94a3b8">&bull; WebSocket (/ws?jobId=...)</text>
    <text x="20" y="215" font-size="12" fill="#94a3b8">&bull; Polling Fallback (every 3s)</text>
    <text x="20" y="235" font-size="12" fill="#10b981">&bull; High-resilience dual-channel</text>

    <rect x="20" y="265" width="210" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="125" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">ACTION: POST /api/upload</text>
    <text x="125" y="303" text-anchor="middle" font-size="10" fill="#94a3b8">Multipart Form &bull; Bearer JWT</text>
  </g>

  <!-- Arrow 1: Frontend -> Backend -->
  <path d="M 310, 300 L 390, 300" fill="none" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <text x="350" y="290" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="600">Upload</text>

  <!-- ================= PHASE 2: BACKEND TIER ================= -->
  <g transform="translate(400, 130)" filter="url(#shadow)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="270" height="42" rx="16" fill="#1e293b" />
    <text x="135" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">2. Express Backend</text>

    <text x="20" y="70" font-size="13" font-weight="600" fill="#f1f5f9">Validation &amp; Ingestion</text>
    <text x="20" y="90" font-size="12" fill="#94a3b8">&bull; Multer memory buffer (5MB)</text>
    <text x="20" y="110" font-size="12" fill="#facc15">&bull; Magic Bytes Check: %PDF-</text>
    <text x="20" y="130" font-size="12" fill="#94a3b8">&bull; JWT Middleware verify</text>

    <line x1="20" y1="145" x2="250" y2="145" stroke="#334155" stroke-dasharray="4" />

    <text x="20" y="170" font-size="13" font-weight="600" fill="#4ade80">Dispatch &amp; Unblock</text>
    <text x="20" y="190" font-size="12" fill="#94a3b8">1. PutObject ➔ Amazon S3</text>
    <text x="20" y="210" font-size="12" fill="#94a3b8">2. Job.create(status: "queued")</text>
    <text x="20" y="230" font-size="12" fill="#94a3b8">3. SendMessage ➔ AWS SQS</text>
    
    <rect x="20" y="255" width="230" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="135" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">HTTP 202 Accepted</text>
    <text x="135" y="295" text-anchor="middle" font-size="10" fill="#cbd5e1">Returns { jobId, status: "queued" }</text>
    <text x="135" y="310" text-anchor="middle" font-size="9" fill="#94a3b8">Zero client blocking (&lt;150ms)</text>
  </g>

  <!-- Multi-Branches from Backend -->
  <!-- Branch to S3 -->
  <path d="M 670, 200 L 760, 200" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" />
  <text x="715" y="190" text-anchor="middle" font-size="10" fill="#38bdf8">S3 PutObject</text>

  <!-- Branch to MongoDB -->
  <path d="M 535, 470 L 535, 540" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <text x="545" y="515" font-size="11" fill="#4ade80">Create Doc</text>

  <!-- Branch to SQS -->
  <path d="M 670, 370 L 760, 370" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <text x="715" y="360" text-anchor="middle" font-size="11" fill="#c084fc" font-weight="600">Enqueue</text>

  <!-- ================= STORAGE & MESSAGING CLOUD ================= -->
  <!-- AWS S3 -->
  <g transform="translate(770, 140)" filter="url(#shadow)">
    <rect width="210" height="120" rx="12" fill="#132338" stroke="#0284c7" stroke-width="1.5" />
    <text x="105" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">AWS S3 (Private Bucket)</text>
    <text x="15" y="55" font-size="11" fill="#cbd5e1">&bull; resumes/{userId}/{jobId}.pdf</text>
    <text x="15" y="75" font-size="11" fill="#cbd5e1">&bull; generated-resumes/{uid}/{jid}.pdf</text>
    <rect x="15" y="88" width="180" height="20" rx="4" fill="#082f49" />
    <text x="105" y="102" text-anchor="middle" font-size="9" fill="#38bdf8">Pre-Signed URLs (1h TTL)</text>
  </g>

  <!-- AWS SQS -->
  <g transform="translate(770, 310)" filter="url(#shadow)">
    <rect width="210" height="130" rx="12" fill="#201538" stroke="#9333ea" stroke-width="1.5" />
    <text x="105" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">AWS SQS Queue</text>
    <text x="15" y="55" font-size="11" fill="#e9d5ff">&bull; Body: { jobId: "uuid" }</text>
    <text x="15" y="75" font-size="11" fill="#e9d5ff">&bull; VisibilityTimeout: 300s</text>
    <text x="15" y="95" font-size="11" fill="#e9d5ff">&bull; Dead-Letter Queue (DLQ)</text>
    <text x="15" y="115" font-size="9" fill="#a855f7">Decoupled Asynchronous Buffer</text>
  </g>

  <!-- MONGODB -->
  <g transform="translate(400, 550)" filter="url(#shadow)">
    <rect width="270" height="150" rx="12" fill="#0f261e" stroke="#059669" stroke-width="1.5" />
    <text x="135" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">MongoDB Database</text>
    <text x="15" y="55" font-size="11" fill="#a7f3d0">&bull; UUID _id (Pre-generated)</text>
    <text x="15" y="75" font-size="11" fill="#a7f3d0">&bull; Compound index: { userId: 1, createdAt: -1 }</text>
    <text x="15" y="95" font-size="11" fill="#a7f3d0">&bull; Atomic find_one_and_update</text>
    <text x="15" y="115" font-size="11" fill="#a7f3d0">&bull; processingHeartbeatAt field</text>
    <text x="15" y="135" font-size="9" fill="#6ee7b7">Guarantees idempotency &amp; crash recovery</text>
  </g>

  <!-- Arrow SQS -> Agent Worker -->
  <path d="M 980, 370 L 1050, 370" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <text x="1015" y="360" text-anchor="middle" font-size="10" fill="#c084fc">Long-Poll (20s)</text>

  <!-- ================= PHASE 3: PYTHON AGENT / LANGGRAPH ================= -->
  <g transform="translate(1060, 130)" filter="url(#shadow)">
    <rect width="290" height="680" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <rect width="290" height="42" rx="16" fill="#1e293b" />
    <text x="145" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#f43f5e">3. Python Agent (LangGraph)</text>

    <!-- Worker Step 1: Claim -->
    <rect x="15" y="60" width="260" height="55" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="80" font-size="11" font-weight="700" fill="#f8fafc">A. Atomic Job Claim &amp; Heartbeat</text>
    <text x="25" y="98" font-size="10" fill="#94a3b8">&bull; find_one_and_update(status: queued)</text>
    <text x="25" y="110" font-size="9" fill="#10b981">&bull; Daemon thread: visibility renew every 60s</text>

    <!-- Worker Step 2: PyMuPDF -->
    <rect x="15" y="125" width="260" height="45" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="145" font-size="11" font-weight="700" fill="#f8fafc">B. PyMuPDF (fitz) Extraction</text>
    <text x="25" y="160" font-size="10" fill="#94a3b8">&bull; Pulls S3 buffer ➔ extracts raw text</text>

    <!-- LangGraph Box -->
    <rect x="15" y="180" width="260" height="310" rx="10" fill="#181329" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="145" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#c084fc">LangGraph Cyclic State Machine</text>

    <!-- Node 1 -->
    <rect x="25" y="215" width="240" height="36" rx="6" fill="#241b3d" stroke="#a855f7" stroke-width="1" />
    <text x="145" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#e9d5ff">1. parse_documents (Groq LLM 70B)</text>
    <text x="145" y="246" text-anchor="middle" font-size="8" fill="#94a3b8">Resume JSON &amp; JD JSON extraction</text>

    <!-- Node 2 -->
    <rect x="25" y="258" width="240" height="40" rx="6" fill="#241b3d" stroke="#a855f7" stroke-width="1" />
    <text x="145" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#e9d5ff">2. ats_score (Deterministic Rule Scorer)</text>
    <text x="145" y="290" text-anchor="middle" font-size="8" fill="#facc15">60% req + 20% nice + 20% fmt (Zero LLM cost)</text>

    <!-- Conditional Branches -->
    <rect x="25" y="306" width="115" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="82" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#818cf8">Score &lt; 40</text>
    <text x="82" y="335" text-anchor="middle" font-size="8" fill="#c7d2fe">suggest_additions</text>
    <text x="82" y="348" text-anchor="middle" font-size="7" fill="#94a3b8">Projects/certs</text>

    <rect x="150" y="306" width="115" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="207" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#818cf8">40 &lt;= Score &lt; Target</text>
    <text x="207" y="335" text-anchor="middle" font-size="8" fill="#c7d2fe">rewrite_resume</text>
    <text x="207" y="348" text-anchor="middle" font-size="7" fill="#94a3b8">Action verbs + gaps</text>

    <!-- Node 5: Verify -->
    <rect x="25" y="365" width="240" height="45" rx="6" fill="#241b3d" stroke="#a855f7" stroke-width="1" />
    <text x="145" y="382" text-anchor="middle" font-size="10" font-weight="600" fill="#e9d5ff">5. verify_score &amp; Feedback Loop</text>
    <text x="145" y="396" text-anchor="middle" font-size="8" fill="#f43f5e">&bull; If score &lt; Target &amp; iter &lt; 3 ➔ Loop back</text>
    <text x="145" y="406" text-anchor="middle" font-size="8" fill="#4ade80">&bull; If Target hit OR iter == 3 ➔ Finish</text>

    <!-- LaTeX PDF Compilation -->
    <rect x="15" y="500" width="260" height="95" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="25" y="520" font-size="11" font-weight="700" fill="#38bdf8">C. LaTeX PDF Compilation</text>
    <text x="25" y="538" font-size="10" fill="#cbd5e1">&bull; Sanitize TeX escape: &amp;, %, $, #</text>
    <text x="25" y="555" font-size="10" fill="#cbd5e1">&bull; Runs pdflatex inside TeX Live container</text>
    <text x="25" y="572" font-size="10" fill="#facc15">&bull; "Score What You Ship": Re-score real PDF</text>
    <text x="25" y="587" font-size="9" fill="#38bdf8">&bull; Upload final PDF to S3</text>

    <!-- Completion / Done -->
    <rect x="15" y="605" width="260" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="145" y="625" text-anchor="middle" font-size="11" font-weight="700" fill="#a7f3d0">D. Finalize &amp; Ack</text>
    <text x="145" y="642" text-anchor="middle" font-size="10" fill="#6ee7b7">MongoDB status: "done" &bull; SQS delete_message</text>
    <text x="145" y="656" text-anchor="middle" font-size="9" fill="#a7f3d0">Callback POST /api/internal/jobs/:id/progress</text>
  </g>

  <!-- Realtime Return Loops -->
  <!-- Agent Progress -> Backend Internal -->
  <path d="M 1060, 770 L 670, 770 L 670, 460" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6" marker-end="url(#arrowCyan)" />
  <text x="865" y="760" text-anchor="middle" font-size="11" fill="#fb7185">Internal Progress Callback (Shared Secret Token)</text>

  <!-- Backend WebSocket Broadcast -> Client -->
  <path d="M 400, 390 L 310, 390" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowEmerald)" />
  <text x="355" y="380" text-anchor="middle" font-size="10" fill="#34d399">WS Push</text>

  <!-- S3 Pre-signed Download -> Client -->
  <path d="M 770, 240 C 600, 240, 350, 450, 280, 470" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6" marker-end="url(#arrowCyan)" />
  <text x="500" y="330" text-anchor="middle" font-size="10" fill="#38bdf8">Direct S3 Pre-Signed Download (Zero Backend RAM Overhead)</text>

  <!-- Legend Bar -->
  <g transform="translate(60, 890)">
    <rect width="1280" height="40" rx="8" fill="#131b2e" stroke="#1e293b" />
    <circle cx="30" cy="20" r="5" fill="#06b6d4" />
    <text x="45" y="24" font-size="11" fill="#94a3b8">HTTP / S3 REST</text>

    <circle cx="200" cy="20" r="5" fill="#a855f7" />
    <text x="215" y="24" font-size="11" fill="#94a3b8">AWS SQS Async Message</text>

    <circle cx="420" cy="20" r="5" fill="#10b981" />
    <text x="435" y="24" font-size="11" fill="#94a3b8">MongoDB Atomic Ops</text>

    <circle cx="630" cy="20" r="5" fill="#f43f5e" />
    <text x="645" y="24" font-size="11" fill="#94a3b8">WebSocket Realtime Feedback</text>

    <circle cx="890" cy="20" r="5" fill="#facc15" />
    <text x="905" y="24" font-size="11" fill="#94a3b8">Key Security &amp; Guardrail Checkpoints</text>
  </g>
</svg>
